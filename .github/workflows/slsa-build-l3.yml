name: RightsFrames SLSA Build L3 Trusted Builder

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      bundle_name:
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    name: Hardened deterministic release build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.sha256 }}
      commit: ${{ steps.identity.outputs.commit }}
      tree: ${{ steps.identity.outputs.tree }}
    env:
      ART_NAME: ${{ inputs.artifact_name }}
    steps:
      - name: Checkout immutable caller revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Verify tagged revision
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            v*) ;;
            *) echo 'SLSA L3 builder requires a version tag'; exit 1 ;;
          esac
          git fetch --force --tags origin
          TARGET="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          test "$TARGET" = "${GITHUB_SHA}"

      - name: Build deterministic release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ART="$ART_NAME"
          TAR="${ART%.gz}"
          git archive \
            --format=tar \
            --prefix="RightsFrames-Termux-${GITHUB_REF_NAME}/" \
            "${GITHUB_SHA}" \
            > "dist/$TAR"
          gzip -n "dist/$TAR"
          sha256sum "dist/$ART" > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE_COMMIT
          git rev-parse HEAD^{tree} > dist/SOURCE_TREE

      - name: Verify artifact digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(sha256sum "dist/$ART_NAME" | awk '{print $1}')"
          test -s "dist/$ART_NAME"
          echo "sha256=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "SLSA_L3_ARTIFACT_SHA256=$DIGEST"

      - name: Generate SLSA provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ inputs.artifact_name }}
          show-summary: true

      - name: Upload L3 release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.bundle_name }}
          path: |
            dist/${{ inputs.artifact_name }}
            dist/SHA256SUMS
            dist/SOURCE_COMMIT
            dist/SOURCE_TREE
          if-no-files-found: error
          retention-days: 90
