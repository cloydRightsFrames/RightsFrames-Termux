name: RightsFrames Enterprise Provenance Gate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: rightsframes-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    name: Source integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = "https://github.com/${GITHUB_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Parse source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in sorted(Path('.').rglob('*.py')):
              if '.git' not in p.parts:
                  ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          PY

      - name: Record immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source-integrity
          git rev-parse HEAD > dist/source-integrity/commit
          git rev-parse HEAD^{tree} > dist/source-integrity/tree
          git show -s --format='%H%n%T%n%P%n%ct%n%s' HEAD > dist/source-integrity/commit-record
          sha256sum dist/source-integrity/* > dist/source-integrity/SHA256SUMS

      - name: Upload source identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-identity-${{ github.sha }}
          path: dist/source-integrity
          if-no-files-found: error
          retention-days: 14

  test:
    name: Core verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r core/requirements.txt

      - name: Compile source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile core/*.py

      - name: Run repository verification
        shell: bash
        run: |
          set -euo pipefail
          if [ -f core/rf_core.py ]; then
            python - <<'PY'
          import core.rf_core
          print("RF_CORE_IMPORT=PASS")
          PY
          fi

  zero-trust-policy:
    name: Zero trust supply-chain policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify supply-chain controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_supply_chain_policy.py

  build-a:
    name: Reproducible build A
    needs:
      - source-integrity
      - test
      - zero-trust-policy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          TARGET="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          test "$TARGET" = "$GITHUB_SHA"

      - name: Build deterministic source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ART="RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar --prefix="RightsFrames-Termux-${GITHUB_REF_NAME}/" "$GITHUB_SHA" > "dist/${ART%.gz}"
          gzip -n "dist/${ART%.gz}"
          sha256sum "dist/${ART}" > dist/SHA256SUMS-A
          git rev-parse HEAD > dist/BUILD-A-COMMIT
          git rev-parse HEAD^{tree} > dist/BUILD-A-TREE

      - name: Upload build A
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rightsframes-build-a-${{ github.sha }}
          path: |
            dist/RightsFrames-Termux-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS-A
            dist/BUILD-A-COMMIT
            dist/BUILD-A-TREE
          if-no-files-found: error
          retention-days: 30

  build-b:
    name: Reproducible build B
    needs:
      - source-integrity
      - test
      - zero-trust-policy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          TARGET="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          test "$TARGET" = "$GITHUB_SHA"

      - name: Build deterministic source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ART="RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar --prefix="RightsFrames-Termux-${GITHUB_REF_NAME}/" "$GITHUB_SHA" > "dist/${ART%.gz}"
          gzip -n "dist/${ART%.gz}"
          sha256sum "dist/${ART}" > dist/SHA256SUMS-B
          git rev-parse HEAD > dist/BUILD-B-COMMIT
          git rev-parse HEAD^{tree} > dist/BUILD-B-TREE

      - name: Upload build B
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rightsframes-build-b-${{ github.sha }}
          path: |
            dist/RightsFrames-Termux-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS-B
            dist/BUILD-B-COMMIT
            dist/BUILD-B-TREE
          if-no-files-found: error
          retention-days: 30

  reproducibility:
    name: Reproducibility gate
    needs:
      - build-a
      - build-b
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build A
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rightsframes-build-a-${{ github.sha }}
          path: build-a

      - name: Download build B
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rightsframes-build-b-${{ github.sha }}
          path: build-b

      - name: Independently compare outputs
        shell: bash
        run: |
          set -euo pipefail
          A="build-a/RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz"
          B="build-b/RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz"

          test -s "$A"
          test -s "$B"

          HA="$(sha256sum "$A" | awk '{print $1}')"
          HB="$(sha256sum "$B" | awk '{print $1}')"

          test "$HA" = "$HB"

          test "$(cat build-a/BUILD-A-COMMIT)" = "$GITHUB_SHA"
          test "$(cat build-b/BUILD-B-COMMIT)" = "$GITHUB_SHA"

          test "$(cat build-a/BUILD-A-TREE)" = "$(cat build-b/BUILD-B-TREE)"

          mkdir -p canonical
          cp "$A" canonical/RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz

          printf '%s  %s\n' \
            "$HA" \
            "RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz" \
            > canonical/SHA256SUMS

          printf '%s\n' "$GITHUB_SHA" > canonical/SOURCE_COMMIT
          printf '%s\n' "$(cat build-a/BUILD-A-TREE)" > canonical/SOURCE_TREE

          cat > canonical/reproducibility.json <<EOF
          {
            "schema": "https://rightsframes.online/provenance/reproducibility/v1",
            "repository": "${GITHUB_REPOSITORY}",
            "tag": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "tree": "$(cat build-a/BUILD-A-TREE)",
            "artifact": "RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz",
            "sha256": "${HA}",
            "buildA": "${HA}",
            "buildB": "${HB}",
            "identical": true,
            "runner": "GitHub-hosted"
          }
          EOF

          python3 -m json.tool canonical/reproducibility.json >/dev/null

      - name: Upload canonical artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rightsframes-canonical-${{ github.sha }}
          path: canonical
          if-no-files-found: error
          retention-days: 90

  slsa3-build:
    name: SLSA Build L3 trusted builder
    needs:
      - source-integrity
      - test
      - zero-trust-policy
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/slsa-build-l3.yml
    with:
      artifact_name: RightsFrames-Termux-${{ github.ref_name }}.tar.gz
      bundle_name: rightsframes-slsa3-${{ github.sha }}

  provenance:
    name: External SLSA provenance
    needs:
      - source-integrity
      - test
      - reproducibility
      - slsa3-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download canonical artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rightsframes-slsa3-${{ github.sha }}
          path: dist

      - name: Verify canonical artifact before attestation
        shell: bash
        run: |
          set -euo pipefail
          ART="dist/RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz"
          test -s "$ART"
          (
            cd dist
            sha256sum -c SHA256SUMS
          )

      - name: Generate GitHub artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/RightsFrames-Termux-${{ github.ref_name }}.tar.gz
          show-summary: true

      - name: Produce release manifest
        shell: bash
        run: |
          set -euo pipefail
          ART="RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz"
          DIGEST="$(sha256sum "dist/${ART}" | awk '{print $1}')"
          TREE="$(cat dist/SOURCE_TREE)"

          python3 - <<PY
          import json

          m = {
              "schema": "https://rightsframes.online/provenance/release-manifest/v2",
              "repository": "${GITHUB_REPOSITORY}",
              "ref": "${GITHUB_REF}",
              "tag": "${GITHUB_REF_NAME}",
              "commit": "${GITHUB_SHA}",
              "tree": "${TREE}",
              "artifact": "${ART}",
              "sha256": "${DIGEST}",
              "predicateType": "https://slsa.dev/provenance/v1",
              "slsaBuildLevel": 3,
              "signerWorkflow": "${GITHUB_REPOSITORY}/.github/workflows/provenance-gate.yml",
              "workflow": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
              "workflowRef": "${GITHUB_WORKFLOW_REF}",
              "runId": "${GITHUB_RUN_ID}",
              "runner": "GitHub-hosted",
              "repositoryVisibility": "public",
              "reproducible": True,
              "independentBuilds": 2,
              "attested": True
          }

          with open("dist/release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(m, f, indent=2, sort_keys=True)
              f.write("\\n")
          PY

          python3 -m json.tool dist/release-manifest.json >/dev/null

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rightsframes-release-evidence-${{ github.sha }}
          path: dist/release-manifest.json
          if-no-files-found: error
          retention-days: 90

  release:
    name: Immutable release publication
    needs:
      - provenance
      - reproducibility
      - slsa3-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download canonical artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rightsframes-slsa3-${{ github.sha }}
          path: dist

      - name: Download independent reproducibility artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rightsframes-canonical-${{ github.sha }}
          path: reproducibility

      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rightsframes-release-evidence-${{ github.sha }}
          path: dist

      - name: Final release integrity gate
        shell: bash
        run: |
          set -euo pipefail

          ART="dist/RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz"

          test -s "$ART"
          test -s dist/SHA256SUMS
          test -s dist/release-manifest.json

          (
            cd dist
            sha256sum -c SHA256SUMS
          )

          python3 - <<PY
          import json
          import hashlib

          manifest = json.load(open("dist/release-manifest.json", encoding="utf-8"))
          artifact = "dist/${ART#dist/}"

          actual = hashlib.sha256(open(artifact, "rb").read()).hexdigest()

          assert manifest["commit"] == "${GITHUB_SHA}"
          assert manifest["tag"] == "${GITHUB_REF_NAME}"
          assert manifest["sha256"] == actual
          assert manifest["reproducible"] is True
          assert manifest["independentBuilds"] == 2
          assert manifest["slsaBuildLevel"] == 3
          assert manifest["signerWorkflow"] == f'{manifest["repository"]}/.github/workflows/provenance-gate.yml'
          PY


      - name: Bind L3 artifact to independent reproducibility result
        shell: bash
        run: |
          set -euo pipefail
          L3="dist/RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz"
          REPRO="reproducibility/RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz"
          test -s "$L3"
          test -s "$REPRO"
          test "$(sha256sum "$L3" | awk '{print $1}')" = "$(sha256sum "$REPRO" | awk '{print $1}')"
          echo 'L3_ARTIFACT=REPRODUCIBILITY_BOUND'

      - name: Verify SLSA Build L3 attestation before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ART="dist/RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz"
          ATTEST_DIR="$(mktemp -d)"
          gh attestation download "$ART" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type 'https://slsa.dev/provenance/v1' \
            --limit 30 \
            --dir "$ATTEST_DIR"
          ATTEST_BUNDLE="$(find "$ATTEST_DIR" -maxdepth 1 -type f -name 'sha256:*' -print -quit)"
          test -s "$ATTEST_BUNDLE"
          TRUSTED_ROOT="$ATTEST_DIR/trusted_root.jsonl"
          gh attestation trusted-root > "$TRUSTED_ROOT"
          test -s "$TRUSTED_ROOT"

          gh attestation verify \
            "$ART" \
            --repo "${GITHUB_REPOSITORY}" \
            --bundle "$ATTEST_BUNDLE" \
            --custom-trusted-root "$TRUSTED_ROOT" \
            --predicate-type 'https://slsa.dev/provenance/v1' \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/provenance-gate.yml" \
            --source-ref "refs/tags/${GITHUB_REF_NAME}" \
            --deny-self-hosted-runners
          echo 'SLSA_BUILD_LEVEL=3_VERIFIED'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_HTTP="$(gh api \
            --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            2>&1 || true)"

          if printf '%s\n' "$RELEASE_HTTP" | grep -q '^HTTP/[0-9.]* 200 '; then
            echo 'release already exists'
            exit 1
          fi

          if printf '%s\n' "$RELEASE_HTTP" | grep -q '^HTTP/[0-9.]* 404 '; then
            :
          else
            echo 'release lookup failed closed'
            printf '%s\n' "$RELEASE_HTTP"
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "RightsFrames ${GITHUB_REF_NAME}" \
            --generate-notes \
            "dist/RightsFrames-Termux-${GITHUB_REF_NAME}.tar.gz" \
            dist/SHA256SUMS \
            dist/release-manifest.json

  release-policy:
    name: Release policy gate
    needs:
      - source-integrity
      - test
      - build-a
      - build-b
      - reproducibility
      - slsa3-build
      - provenance
      - release
      - zero-trust-policy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Require every security gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.source-integrity.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.build-a.result }}" = success
          test "${{ needs.build-b.result }}" = success
          test "${{ needs.reproducibility.result }}" = success
          test "${{ needs.slsa3-build.result }}" = success
          test "${{ needs.provenance.result }}" = success
          test "${{ needs.release.result }}" = success
          test "${GITHUB_REF_TYPE}" = tag

          case "${GITHUB_REF_NAME}" in
            v*) ;;
            *) exit 1 ;;
          esac

      - name: Emit machine-verifiable final state
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'RIGHTSFRAMES_RELEASE_GATE=PASSED' \
            'SOURCE_IDENTITY=VERIFIED' \
            'BUILD_A=VERIFIED' \
            'BUILD_B=VERIFIED' \
            'REPRODUCIBILITY=VERIFIED' \
            'SLSA_ATTESTATION=VERIFIED_BY_WORKFLOW' \
            'RELEASE_MANIFEST=VERIFIED' \
            'RELEASE_PUBLICATION=VERIFIED' \
            "COMMIT=${GITHUB_SHA}" \
            "TAG=${GITHUB_REF_NAME}"
