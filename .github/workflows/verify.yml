concurrency:
  group: rightsframes-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Verify Ledger Integrity
permissions:
  contents: read
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RF_DATA_DIR: /tmp/ci_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install hash-verified runtime and test dependencies
        run: |
          python -m pip install --require-hashes -r core/requirements.txt
          python -m pip install --require-hashes -r core/requirements-dev.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Run full test suite
        run: python -m pytest -q
      - name: Smoke test - chain, anchor, tamper detection
        run: |
          cd core
          python3 -c "
          import sqlite3
          import rf_core
          rf_core.init_db()
          rf_core.append_entry('test', {'msg': 'ci'})
          ok, msg = rf_core.verify_chain()
          assert ok, f'chain failed: {msg}'
          anchor = rf_core.create_anchor()
          assert anchor['seq'] >= 1, anchor
          ok, msg = rf_core.verify_anchors(pinned_key_id=anchor['key_id'])
          assert ok, f'anchor verify failed: {msg}'
          conn = sqlite3.connect(rf_core.DB_PATH)
          conn.execute(\"UPDATE ledger_entries SET payload='{\\\"x\\\":1}' WHERE id=1\")
          conn.commit(); conn.close()
          ok, msg = rf_core.verify_chain()
          assert not ok, 'TAMPER WAS NOT DETECTED -- this is a real security failure'
          print('All checks passed, tamper correctly detected')
          "
      - name: End-to-end - export bundle and verify against an off-box pin
        run: |
          export RF_DATA_DIR=/tmp/ci_e2e
          python3 -c "import sys; sys.path.insert(0, 'core'); import rf_core; rf_core.append_entry('ci.e2e', {'n': 1}); print(rf_core.create_anchor()['anchor_hash'])" > /tmp/pin.txt
          python3 tools/rf_export_evidence.py --data-dir "$RF_DATA_DIR" --out /tmp/bundle.zip
          python3 verifier/rf_verify.py /tmp/bundle.zip --pin-anchor "1:$(cat /tmp/pin.txt)"
          if python3 verifier/rf_verify.py /tmp/bundle.zip --pin-anchor "1:$(printf '0%.0s' $(seq 64))"; then
            echo 'wrong pin accepted -- verifier is broken'; exit 1
          fi

  test-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      RF_DATA_DIR: /tmp/ci_matrix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-verified dependencies
        run: |
          python -m pip install --require-hashes -r core/requirements.txt
          python -m pip install --require-hashes -r core/requirements-dev.txt
          python -m pip check
      - name: Run full test suite
        run: python -m pytest -q

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build image from repository root
        run: docker build -f core/Dockerfile -t rightsframes-core:ci .
      - name: Run hardened container and exercise the API
        run: |
          key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker run -d --name rf -p 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e RF_API_KEY="$key" rightsframes-core:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS -X POST http://127.0.0.1:8000/entries -H "X-API-Key: $key" \
            -H 'content-type: application/json' -d '{"entry_type":"ci.container","payload":{"n":1}}'
          curl -fsS -X POST http://127.0.0.1:8000/anchor -H "X-API-Key: $key"
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/entries \
            -H 'X-API-Key: wrong' -H 'content-type: application/json' -d '{"entry_type":"x"}')"
          test "$status" = 401
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
      - name: Container logs
        if: always()
        run: docker logs rf || true
