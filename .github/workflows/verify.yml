concurrency:
  group: rightsframes-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Verify Ledger Integrity
permissions:
  contents: read
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r core/requirements.txt
      - name: Smoke test - chain, anchor, tamper detection
        run: |
          cd core
          export RF_DATA_DIR=/tmp/ci_test
          python3 -c "
          import rf_core
          rf_core.init_db()
          rf_core.append_entry('test', {'msg': 'ci'})
          ok, msg = rf_core.verify_chain()
          assert ok, f'chain failed: {msg}'
          anchor_result = rf_core.create_anchor()
          if isinstance(anchor_result, dict):
              ok, msg = bool(anchor_result), str(anchor_result)
          else:
              ok, msg = anchor_result
          assert ok, f'anchor failed: {msg}'
          ok, msg = rf_core.verify_anchors()
          assert ok, f'anchor verify failed: {msg}'
          import sqlite3
          conn = sqlite3.connect(rf_core.DB_PATH)
          conn.execute(\"UPDATE ledger_entries SET payload='{\\\"x\\\":1}' WHERE id=1\")
          conn.commit(); conn.close()
          ok, msg = rf_core.verify_chain()
          assert not ok, 'TAMPER WAS NOT DETECTED -- this is a real security failure'
          print('All checks passed, tamper correctly detected')
          "
