name: "Advanced CodeQL Analysis"
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: "CodeQL Analysis - ${{ matrix.language }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: "python"
            runner: "ubuntu-latest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml
          tools: latest
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: "/language:${{ matrix.language }}"
          upload: always
  dependency-check:
    name: "OWASP Dependency Check"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prepare complete runtime and test dependency scan
        id: prepare
        run: python tools/rf_owasp_evidence.py prepare
      - name: Refresh NVD and scan with the pinned image
        id: scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OSS_INDEX_TOKEN: ${{ secrets.OSS_INDEX_TOKEN }}
          OSS_INDEX_USERNAME: ${{ secrets.OSS_INDEX_USERNAME }}
        run: python tools/rf_owasp_evidence.py scan
      - name: Verify NVD freshness, dependency coverage and SARIF locations
        id: evidence
        if: always() && steps.prepare.outcome == 'success'
        env:
          OSS_INDEX_TOKEN: ${{ secrets.OSS_INDEX_TOKEN }}
        run: python tools/rf_owasp_evidence.py check
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        if: always() && steps.evidence.outcome == 'success'
        with:
          sarif_file: reports/owasp/dependency-check-upload.sarif
          category: dependency-check
      - name: Retain original reports and freshness evidence
        if: always() && hashFiles('reports/owasp/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owasp-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/owasp/
          retention-days: 30
          if-no-files-found: error
  trivy-scan:
    name: "Trivy Container & IaC Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"
  semgrep-scan:
    name: "Semgrep SAST Analysis"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Semgrep CLI
        run: python -m pip install semgrep==1.179.0

      - name: Run Semgrep security rules
        run: >-
          semgrep scan
          --config p/owasp-top-ten
          --config p/security-audit
          --config p/ci
          --error
          --sarif
          --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: "semgrep.sarif"
          category: "semgrep"
  secret-scanning:
    name: "Secret Detection"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e
        with:
          path: ./
          extra_args: --debug
      - uses: GitGuardian/ggshield-action@10e9055712b4630c3d514ec16dca25c94b752b52
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
