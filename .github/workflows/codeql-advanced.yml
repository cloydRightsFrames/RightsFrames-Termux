name: "Advanced CodeQL Analysis"
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: "CodeQL Analysis - ${{ matrix.language }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: "python"
            runner: "ubuntu-latest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml
          tools: linked
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:${{ matrix.language }}"
          upload: always
  dependency-check:
    name: "OWASP Dependency Check"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Prepare complete runtime and test dependency scan
        id: prepare
        run: python tools/rf_owasp_evidence.py prepare
      - name: Refresh NVD and scan with the pinned image
        id: scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OSS_INDEX_TOKEN: ${{ secrets.OSS_INDEX_TOKEN }}
          OSS_INDEX_USERNAME: ${{ secrets.OSS_INDEX_USERNAME }}
        run: python tools/rf_owasp_evidence.py scan
      - name: Verify NVD freshness, dependency coverage and SARIF locations
        id: evidence
        if: always() && steps.prepare.outcome == 'success'
        env:
          OSS_INDEX_TOKEN: ${{ secrets.OSS_INDEX_TOKEN }}
        run: python tools/rf_owasp_evidence.py check
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: always() && steps.evidence.outcome == 'success'
        with:
          sarif_file: reports/owasp/dependency-check-upload.sarif
          category: dependency-check
      - name: Retain original reports and freshness evidence
        if: always() && hashFiles('reports/owasp/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owasp-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/owasp/
          retention-days: 30
          if-no-files-found: error
  trivy-scan:
    name: "Trivy Container & IaC Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"
  dependency-audit:
    name: "Dependency audit (pip-audit)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install hash-locked pip-audit
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/scripts/requirements-audit.txt
      - name: Audit every hash-locked requirements file (runtime, tests and CI tools)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t LOCKS < <(git ls-files 'core/requirements*.txt' ':(glob).github/**/requirements*.txt')
          test "${#LOCKS[@]}" -ge 7
          STATUS=0
          for LOCK in "${LOCKS[@]}"; do
            echo "::group::${LOCK}"
            pip-audit --strict --disable-pip --require-hashes --progress-spinner off --desc on -r "${LOCK}" || STATUS=1
            echo "::endgroup::"
          done
          exit "${STATUS}"
  semgrep-scan:
    name: "Semgrep SAST Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install hash-locked Semgrep CLI
        # The lock overrides pins with published advisories (see
        # .github/semgrep/requirements.in); --no-deps installs exactly it.
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r .github/semgrep/requirements.txt

      - name: Run Semgrep security rules
        run: >-
          semgrep scan
          --config p/owasp-top-ten
          --config p/security-audit
          --config p/ci
          --error
          --sarif
          --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: "semgrep.sarif"
          category: "semgrep"
  secret-scanning:
    name: "Secret Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb
        with:
          path: ./
          extra_args: --debug
      - uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
