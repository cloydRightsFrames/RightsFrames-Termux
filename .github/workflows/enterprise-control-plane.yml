name: RightsFrames Enterprise Control Plane

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rightsframes-enterprise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Run the portable enterprise gate
        shell: bash
        run: bash scripts/rf-enterprise-gate
