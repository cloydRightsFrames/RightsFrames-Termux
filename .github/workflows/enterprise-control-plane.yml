name: RightsFrames Enterprise Control Plane

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rightsframes-enterprise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile control plane
        shell: bash
        run: python -m py_compile enterprise/control_plane/*.py
      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run control-plane tests
        shell: bash
        run: python -m pytest tests/test_enterprise_control_plane.py -v
      - name: Verify readiness
        shell: bash
        run: python -m enterprise.control_plane.cli readiness
      - name: Verify existing supply-chain policy
        shell: bash
        run: python tools/verify_supply_chain_policy.py
