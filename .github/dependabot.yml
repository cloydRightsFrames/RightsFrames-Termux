version: 2
# Reviewers come from .github/CODEOWNERS (the `reviewers` key is retired).
# Every ecosystem waits 7 days after a release before proposing it, so a
# freshly published malicious version is unlikely to reach a lock file.
# With `include: scope` Dependabot writes "<prefix>(deps): ...".
updates:
- package-ecosystem: pip
  cooldown:
    default-days: 7
  directory: /core
  schedule:
    interval: daily
    time: '03:15'
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - python
  commit-message:
    prefix: chore
    include: scope
  rebase-strategy: auto
- package-ecosystem: pip
  cooldown:
    default-days: 7
  directory: /.github/scripts
  schedule:
    interval: weekly
    day: monday
    time: '03:45'
    timezone: UTC
  groups:
    ci-tools:
      patterns:
      - '*'
  open-pull-requests-limit: 3
  labels:
  - dependencies
  commit-message:
    prefix: ci
    include: scope
- package-ecosystem: docker
  cooldown:
    default-days: 7
  directory: /core
  schedule:
    interval: daily
    time: '03:30'
    timezone: UTC
  open-pull-requests-limit: 5
  labels:
  - dependencies
  commit-message:
    prefix: build
    include: scope
- package-ecosystem: github-actions
  groups:
    codeql-action:
      patterns:
      - "github/codeql-action/*"
  cooldown:
    default-days: 7
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '04:00'
    timezone: UTC
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: ci
    include: scope
