version: 2
updates:
- package-ecosystem: pip
  cooldown:
    default-days: 7
  directory: /core
  schedule:
    interval: daily
    time: 03:15
    timezone: UTC
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - python
  commit-message:
    prefix: 'chore(deps):'
    include: scope
  rebase-strategy: auto
- package-ecosystem: docker
  cooldown:
    default-days: 7
  directory: /core
  schedule:
    interval: daily
    time: 03:30
    timezone: UTC
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: 'chore(docker):'
    include: scope
- package-ecosystem: github-actions
  cooldown:
    default-days: 7
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 04:00
    timezone: UTC
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: 'ci:'
    include: scope
