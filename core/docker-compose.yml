services:
  rightsframes-core:
    build:
      context: ..
      dockerfile: core/Dockerfile
    environment:
      RF_API_KEY: ${RF_API_KEY:-}
      RF_ALLOWED_HOSTS: ${RF_ALLOWED_HOSTS:-127.0.0.1,localhost}
      # Signing keys sealed at rest (core/rf_keyseal.py). Mount the passphrase file
      # owned by uid 10001 with mode 0600 and point RF_KEY_PASSPHRASE_FILE at it;
      # RF_REQUIRE_SEALED_KEYS=1 then refuses plaintext keys.
      RF_KEY_PASSPHRASE_FILE: ${RF_KEY_PASSPHRASE_FILE:-}
      RF_REQUIRE_SEALED_KEYS: ${RF_REQUIRE_SEALED_KEYS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rf_data:/data
    # Runtime hardening, verified in CI (.github/workflows/container.yml):
    # read-only root filesystem, no Linux capabilities, no privilege gain.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  rf_data:
