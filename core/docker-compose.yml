services:
  rightsframes-core:
    build:
      context: ..
      dockerfile: core/Dockerfile
    environment:
      RF_API_KEY: ${RF_API_KEY:-}
      RF_ALLOWED_HOSTS: ${RF_ALLOWED_HOSTS:-127.0.0.1,localhost}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rf_data:/data
volumes:
  rf_data:
